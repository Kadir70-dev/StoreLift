name: Generate StoreLift Go dependency lockfile (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-go-sum.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Resolve modules and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd api
          go mod tidy
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/go.mod api/go.sum
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: add reproducible Go module lockfile'
          git push origin HEAD:main
