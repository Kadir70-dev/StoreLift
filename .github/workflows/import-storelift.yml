name: Import StoreLift source (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.storelift-source.tar.xz.b64'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack complete source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .storelift-source.tar.xz.b64 > /tmp/storelift-source.tar.xz
          echo 'e29a389f1bfcea0c3a4c1b4762376cd3565a4c6808a6e9db11e06886ce252515  /tmp/storelift-source.tar.xz' | sha256sum --check
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/storelift-source.tar.xz', 'r:xz') as archive:
              members = archive.getmembers()
              for m in members:
                  if m.name.startswith('/') or '..' in m.name.split('/') or not m.isfile():
                      raise SystemExit(f'Unsafe archive entry: {m.name}')
              print('Checked', len(members), 'source files')
          PY
          tar -xJf /tmp/storelift-source.tar.xz -C .
          test -f api/main.go && test -f web/package.json && test -f db/schema.sql
          test -f docs/QA_AND_BLOCKERS.md
          mv .github/workflows/qa.yml docs/qa-workflow.yml
          rm .storelift-source.tar.xz.b64
      - name: Commit original project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: import full StoreLift MVP source (60 files)'
          git push origin HEAD:main
