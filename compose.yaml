# Local development only. Do not deploy these sample credentials or ports to production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storelift
      POSTGRES_PASSWORD: storelift_local_only
      POSTGRES_DB: storelift
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storelift -d storelift']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
